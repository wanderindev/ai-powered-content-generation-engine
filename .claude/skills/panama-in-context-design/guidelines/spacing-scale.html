<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="0.25rem base step — 1 through 32" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 20px 24px; display: flex; gap: 14px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--color-brand); border-radius: var(--radius-sm); width: 22px; }
  .col .n { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .col .px { font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:var(--space-1)"></div><div class="n">1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:var(--space-2)"></div><div class="n">2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:var(--space-3)"></div><div class="n">3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:var(--space-4)"></div><div class="n">4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:var(--space-6)"></div><div class="n">6</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:var(--space-8)"></div><div class="n">8</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:var(--space-12)"></div><div class="n">12</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:var(--space-16)"></div><div class="n">16</div><div class="px">64</div></div>
    <div class="col"><div class="bar" style="height:var(--space-24)"></div><div class="n">24</div><div class="px">96</div></div>
  </div>
</body>
</html>
