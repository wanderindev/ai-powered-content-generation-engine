<!-- @dsCard group="Type" viewport="700x200" name="Display & title" subtitle="Hero h1 and section h2 — semibold, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 22px 24px; }
  .eyebrow { font-size: var(--eyebrow-size); font-weight: var(--eyebrow-weight); color: var(--eyebrow-color); margin: 0 0 6px; }
  .display { font-size: 3rem; font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); margin: 0; text-wrap: balance; }
  .title { font-size: var(--text-3xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); margin: 18px 0 0; color: var(--text-heading); }
  code { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-left: 8px; font-weight: 400; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">For Educators</p>
    <h1 class="display">Where every site tells a story.</h1>
    <h2 class="title">Stories from Panama's Past <code>text-4xl/600/-0.025em</code></h2>
  </div>
</body>
</html>
