<!-- @dsCard group="Colors" viewport="700x190" name="Text & surfaces" subtitle="Semantic aliases for type and backgrounds" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); }
  .wrap { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); font-weight: var(--weight-semibold); }
  .line { display: flex; align-items: baseline; justify-content: space-between; padding: 3px 0; }
  .line .t { font-size: 15px; }
  .line code { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .surf { display: flex; gap: 8px; }
  .chip { flex: 1; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; border: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <h4>Text</h4>
      <div class="line"><span class="t" style="color:var(--text-heading);font-weight:600">Heading</span><code>--text-heading</code></div>
      <div class="line"><span class="t" style="color:var(--text-body)">Body copy</span><code>--text-body</code></div>
      <div class="line"><span class="t" style="color:var(--text-secondary)">Secondary</span><code>--text-secondary</code></div>
      <div class="line"><span class="t" style="color:var(--text-muted)">Muted meta</span><code>--text-muted</code></div>
      <div class="line"><span class="t" style="color:var(--text-link);font-weight:600">Link &rarr;</span><code>--text-link</code></div>
    </div>
    <div class="col">
      <h4>Surfaces</h4>
      <div class="surf">
        <div class="chip" style="background:var(--surface);color:var(--text-muted)">surface</div>
        <div class="chip" style="background:var(--surface-muted);color:var(--text-muted)">muted</div>
        <div class="chip" style="background:var(--surface-subtle);color:var(--text-muted)">subtle</div>
      </div>
      <div class="surf" style="margin-top:8px">
        <div class="chip" style="background:var(--surface-dark);color:#fff;border-color:var(--surface-dark)">dark</div>
        <div class="chip" style="background:var(--color-brand-soft);color:var(--color-brand)">brand-soft</div>
        <div class="chip" style="background:var(--color-brand);color:#fff;border-color:var(--color-brand)">brand</div>
      </div>
    </div>
  </div>
</body>
</html>
