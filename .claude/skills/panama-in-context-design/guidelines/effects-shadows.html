<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & shadows" subtitle="xs buttons · sm/md cards · lg popovers · xl modals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 26px 24px; display: flex; gap: 26px; align-items: center; justify-content: space-between; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 88px; height: 60px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); }
  .col .n { font-size: 11px; font-weight: 600; }
  .col .u { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div><div class="u">buttons</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div><div class="u">cards</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div><div class="u">dropdowns</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div><div class="u">avatar · popover</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div><div class="u">modal</div></div>
  </div>
</body>
</html>
