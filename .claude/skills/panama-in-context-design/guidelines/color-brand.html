<!-- @dsCard group="Colors" viewport="700x180" name="Brand scale" subtitle="Sky-blue #1095d3 — the single accent, mapped to Tailwind 'indigo'" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 20px 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 72px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; }
  .sw span { font-size: 10px; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
  .meta { margin-top: 12px; display: flex; gap: 24px; font-size: 12px; color: var(--text-secondary); }
  .meta b { color: var(--text-heading); font-weight: var(--weight-semibold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:var(--brand-50)"><span style="color:#0a5a80">50</span></div>
      <div class="sw" style="background:var(--brand-100)"><span style="color:#0a5a80">100</span></div>
      <div class="sw" style="background:var(--brand-200)"><span style="color:#0a5a80">200</span></div>
      <div class="sw" style="background:var(--brand-300)"><span style="color:#073c55">300</span></div>
      <div class="sw" style="background:var(--brand-400)"><span style="color:#fff">400</span></div>
      <div class="sw" style="background:var(--brand-500)"><span style="color:#fff">500</span></div>
      <div class="sw" style="background:var(--brand-600);outline:2px solid var(--brand-900);outline-offset:-2px"><span style="color:#fff">600 ●</span></div>
      <div class="sw" style="background:var(--brand-700)"><span style="color:#fff">700</span></div>
      <div class="sw" style="background:var(--brand-800)"><span style="color:#fff">800</span></div>
      <div class="sw" style="background:var(--brand-900)"><span style="color:#fff">900</span></div>
      <div class="sw" style="background:var(--brand-950)"><span style="color:#a3dbf3">950</span></div>
    </div>
    <div class="meta">
      <div><b>600 · #1095d3</b> — primary / links / focus</div>
      <div><b>700 · #0d78aa</b> — hover &amp; pressed</div>
      <div><b>50 · #e8f6fc</b> — soft chip fill</div>
    </div>
  </div>
</body>
</html>
