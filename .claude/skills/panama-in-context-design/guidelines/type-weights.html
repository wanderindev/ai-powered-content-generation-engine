<!-- @dsCard group="Type" viewport="700x150" name="Weights & mono" subtitle="400/500/600/700 + the system mono stack" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 20px 24px; display: flex; gap: 36px; align-items: center; }
  .weights div { font-size: 22px; line-height: 1.5; }
  .weights span { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-left: 10px; }
  .mono { border-left: 1px solid var(--border); padding-left: 36px; }
  .mono code { font-family: var(--font-mono); font-size: 13px; color: var(--text-body); display: block; line-height: 1.7; }
  .mono .lbl { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="weights">
      <div style="font-weight:400">Normal<span>400</span></div>
      <div style="font-weight:500">Medium<span>500</span></div>
      <div style="font-weight:600">Semibold<span>600</span></div>
      <div style="font-weight:700">Bold<span>700</span></div>
    </div>
    <div class="mono">
      <div class="lbl">--font-mono</div>
      <code>$ /api/v1/tours</code>
      <code>price: $45.00</code>
      <code>2026-04-02</code>
    </div>
  </div>
</body>
</html>
