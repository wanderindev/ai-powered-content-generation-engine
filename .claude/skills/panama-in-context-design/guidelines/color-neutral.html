<!-- @dsCard group="Colors" viewport="700x180" name="Neutral scale" subtitle="Stock Tailwind grays — text, surfaces, borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); color: var(--text-heading); }
  .wrap { padding: 20px 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .sw { flex: 1; height: 72px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; }
  .sw span { font-size: 10px; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
  .meta { margin-top: 12px; display: flex; gap: 24px; font-size: 12px; color: var(--text-secondary); }
  .meta b { color: var(--text-heading); font-weight: var(--weight-semibold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:var(--gray-50)"><span style="color:#374151">50</span></div>
      <div class="sw" style="background:var(--gray-100)"><span style="color:#374151">100</span></div>
      <div class="sw" style="background:var(--gray-200)"><span style="color:#374151">200</span></div>
      <div class="sw" style="background:var(--gray-300)"><span style="color:#374151">300</span></div>
      <div class="sw" style="background:var(--gray-400)"><span style="color:#fff">400</span></div>
      <div class="sw" style="background:var(--gray-500)"><span style="color:#fff">500</span></div>
      <div class="sw" style="background:var(--gray-600)"><span style="color:#fff">600</span></div>
      <div class="sw" style="background:var(--gray-700)"><span style="color:#fff">700</span></div>
      <div class="sw" style="background:var(--gray-800)"><span style="color:#fff">800</span></div>
      <div class="sw" style="background:var(--gray-900)"><span style="color:#fff">900</span></div>
      <div class="sw" style="background:var(--gray-950)"><span style="color:#9ca3af">950</span></div>
    </div>
    <div class="meta">
      <div><b>900</b> headings</div>
      <div><b>700</b> body</div>
      <div><b>500</b> muted / meta</div>
      <div><b>200</b> hairline borders</div>
      <div><b>50</b> muted surfaces</div>
    </div>
  </div>
</body>
</html>
