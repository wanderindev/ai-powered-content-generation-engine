<!-- @dsCard group="Type" viewport="700x210" name="Body & eyebrow" subtitle="Paragraph copy, supporting text, brand kicker" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface); }
  .wrap { padding: 22px 24px; max-width: 620px; }
  .eyebrow { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--color-brand); margin: 0 0 8px; }
  .lead { font-size: var(--text-lg); line-height: var(--leading-7); color: var(--text-body); margin: 0; }
  .small { font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--text-secondary); margin: 12px 0 0; }
  code { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">For Travelers</p>
    <p class="lead">Discover the real Panama through the eyes of a local expert. Our private guided tours reveal the fascinating stories, hidden gems, and cultural richness that make this country truly unique.</p>
    <p class="small">Supporting copy at <code>text-sm</code> in <code>--text-secondary</code> — used for captions, form hints, and meta.</p>
  </div>
</body>
</html>
