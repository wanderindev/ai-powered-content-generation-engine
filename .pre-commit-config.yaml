# Local secret-scanning belt-and-suspenders for the CI gitleaks job.
#
# One-time setup (per clone):
#   pip install pre-commit   # or: pipx install pre-commit
#   pre-commit install
#
# After that, every `git commit` runs gitleaks against the *staged* changes
# and blocks the commit if a secret is detected — catching leaks before they
# ever reach a commit, one step earlier than the CI job in
# .github/workflows/ci.yml (which scans the pushed working tree).
#
# Parity with CI is intentional:
#   - same engine version (gitleaks v8.21.2, pinned below === ci.yml)
#   - same allowlist (.gitleaks.toml at the repo root, auto-discovered)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
