# Panama In Context + Feliu Dev + Atelier Loyalty — Production Nginx Configuration
# PIC's frontend container handles all incoming traffic on ports 80/443
# and reverse-proxies the feliu.dev domains to the trd-* containers (the
# Feliu Dev app, formerly TheRelevantDev) and loyalty.atelierm.store to the
# loyalty-app container (atelier-loyalty-app repo) via the shared-web network.
#
# Upstreams are referenced through variables with a Docker-DNS resolver so
# nginx re-resolves them at request time. With literal proxy_pass hostnames
# nginx resolves once at config load; when watchtower recreates an upstream
# container it can come back on a different IP and every new connection gets
# 502 until a manual `nginx -s reload` (this took feliu.dev down on
# 2026-07-22 when the trd-* containers swapped IPs on deploy). Variables also
# mean a missing upstream no longer prevents nginx from booting.

# --- HTTP server block: ACME challenge and redirect to HTTPS ---
server {
    listen 80;
    server_name panamaincontext.com www.panamaincontext.com public.panamaincontext.com api.panamaincontext.com admin.panamaincontext.com feliu.dev www.feliu.dev api.feliu.dev loyalty.atelierm.store;

    # Serve ACME challenge files for Let's Encrypt
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Redirect www and public to canonical domain ---
server {
    listen 443 ssl;
    server_name www.panamaincontext.com public.panamaincontext.com;

    ssl_certificate /etc/letsencrypt/live/public.panamaincontext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.panamaincontext.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://panamaincontext.com$request_uri;
}

# --- HTTPS server block for api.panamaincontext.com (Backend API) ---
server {
    listen 443 ssl;
    server_name api.panamaincontext.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/public.panamaincontext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.panamaincontext.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pic_backend pic-backend;

    # Proxy all requests to the backend container
    location / {
        proxy_pass http://$pic_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long requests (LLM calls can take minutes)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# --- HTTPS server block for panamaincontext.com (Public Website) ---
server {
    listen 443 ssl;
    server_name panamaincontext.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/public.panamaincontext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.panamaincontext.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pic_backend pic-backend;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cache static assets (hashed filenames from Vite — safe to cache long-term)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Translation JSON files — short cache, must revalidate on each visit
    location /locales/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://$pic_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow image uploads up to 20MB
        client_max_body_size 20M;

        # Timeouts for long requests. Study-guide generation runs many sequential
        # LLM calls (per grade band: Sonnet+thinking condense → outline → blocks),
        # so a 3-band excursion can take well over 5 minutes — 300s used to 504.
        # Generation should eventually move to a background job; until then, allow
        # up to 20 minutes so the synchronous request can complete.
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }

    # Proxy static files (article images) to backend
    location /static/ {
        proxy_pass http://$pic_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Serve React SPA - support client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTPS server block for admin.panamaincontext.com ---
server {
    listen 443 ssl;
    server_name admin.panamaincontext.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/public.panamaincontext.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.panamaincontext.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        return 302 https://panamaincontext.com;
    }
}

# =============================================================================
# Feliu Dev (feliu.dev) — Reverse proxy to the trd-* containers via shared-web
# =============================================================================

# --- Redirect www to canonical ---
server {
    listen 443 ssl;
    server_name www.feliu.dev;

    ssl_certificate /etc/letsencrypt/live/feliu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feliu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://feliu.dev$request_uri;
}

# --- HTTPS: api.feliu.dev → Feliu Dev backend ---
server {
    listen 443 ssl;
    server_name api.feliu.dev;

    ssl_certificate /etc/letsencrypt/live/feliu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feliu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $trd_backend trd-backend;

    location / {
        proxy_pass http://$trd_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# --- HTTPS: feliu.dev → Feliu Dev frontend ---
server {
    listen 443 ssl;
    server_name feliu.dev;

    ssl_certificate /etc/letsencrypt/live/feliu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feliu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $trd_frontend trd-frontend;

    location / {
        proxy_pass http://$trd_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long requests (LLM calls proxied via the frontend)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# =============================================================================
# Atelier Loyalty (loyalty.atelierm.store) — Reverse proxy to loyalty-app
# (atelier-loyalty-app repo) via shared-web. The variable upstream means an
# absent loyalty-app no longer prevents nginx from booting (requests just 502
# until the app is up).
# =============================================================================

server {
    listen 443 ssl;
    server_name loyalty.atelierm.store;

    ssl_certificate /etc/letsencrypt/live/loyalty.atelierm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loyalty.atelierm.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Room for CSV imports uploaded through the admin UI (Epic B)
    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $loyalty_app loyalty-app;

    location / {
        proxy_pass http://$loyalty_app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
