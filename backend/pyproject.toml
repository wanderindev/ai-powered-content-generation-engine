[project]
name = "panama-in-context-api"
version = "1.0.0"
description = "API for Panama In Context"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # Allow unused imports in tests
"alembic/*" = ["F401"]  # Allow unused imports in migrations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
